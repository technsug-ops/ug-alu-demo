<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UG-Alu Produktionssteuerung – Demo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --bg:#F3F5F7; --panel:#FFFFFF; --ink:#1C2024; --ink-2:#4F575E; --ink-3:#8A9298;
  --line:#D6DAD8; --line-2:#E6E9E7; --alu:#6C7780; --alu-dark:#383E42;
  --ok:#1E7B4F; --ok-bg:#E3F3EA; --warn:#B4600A; --warn-bg:#FBEFDD; --bad:#B3261E; --bad-bg:#FBE4E2;
  --sel:#DDE7F2; --sel-ink:#173E66; --side:#383E42; --brand:#0E7C86; --brand-2:#13A3B0; --brand-bg:#E3F4F6; --brand-ink:#0B5B62; --shadow:0 1px 2px rgba(16,24,40,.05),0 10px 30px -18px rgba(16,24,40,.35);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#17191B; --panel:#212427; --ink:#ECEEEF; --ink-2:#B5BBC0; --ink-3:#7E868C; --line:#383D41; --line-2:#2C3034;
  --alu:#9AA4AC; --alu-dark:#C9D0D5; --ok:#5FC28B; --ok-bg:#1B3327; --warn:#E6A24C; --warn-bg:#3A2A14; --bad:#F08C84; --bad-bg:#3E1F1D;
  --sel:#24364A; --sel-ink:#BFD6F0; --side:#101214; --brand:#2BB3BF; --brand-2:#5CD1DB; --brand-bg:#113A3E; --brand-ink:#9FE3E9; --shadow:0 1px 2px rgba(0,0,0,.3); }}
:root[data-theme="dark"]{
  --bg:#17191B; --panel:#212427; --ink:#ECEEEF; --ink-2:#B5BBC0; --ink-3:#7E868C; --line:#383D41; --line-2:#2C3034;
  --alu:#9AA4AC; --alu-dark:#C9D0D5; --ok:#5FC28B; --ok-bg:#1B3327; --warn:#E6A24C; --warn-bg:#3A2A14; --bad:#F08C84; --bad-bg:#3E1F1D;
  --sel:#24364A; --sel-ink:#BFD6F0; --side:#101214; --brand:#2BB3BF; --brand-2:#5CD1DB; --brand-bg:#113A3E; --brand-ink:#9FE3E9; --shadow:0 1px 2px rgba(0,0,0,.3); }
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Inter Tight",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:224px minmax(0,1fr);min-height:100%}
.side{background:linear-gradient(170deg,#1B2A38 0%,#0F1A24 70%,#0B2A2E 100%);color:#F2F4F5;padding:20px 14px;position:sticky;top:0;height:100vh;height:100dvh;display:flex;flex-direction:column;gap:4px;overflow:auto}
.brand{font-weight:700;font-size:15.5px;letter-spacing:-.01em;margin:0 0 2px}
.brand small{display:block;font-weight:400;font-size:12px;opacity:.7;margin-top:2px}
.demo-tag{display:inline-block;font-size:11px;padding:2px 8px;border:1px solid rgba(255,255,255,.35);border-radius:999px;opacity:.85;margin:6px 0 14px}
.nav{display:flex;flex-direction:column;gap:1px;margin:0;padding:0;list-style:none}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;font-size:14px;opacity:.78;width:100%}
.nav button:hover{background:rgba(255,255,255,.08);opacity:1}
.nav button[aria-current="page"]{background:var(--brand);color:#fff;opacity:1;font-weight:600;box-shadow:0 6px 16px -8px var(--brand)}
.nav button:focus-visible{outline:2px solid #fff;outline-offset:2px}
.nav .step{width:22px;height:22px;border-radius:50%;border:1.5px solid rgba(255,255,255,.45);display:grid;place-items:center;font-size:11px;flex:none}
.nav .step.done{background:#5FC28B;border-color:#5FC28B;color:#0E2A1B}
.nav button[aria-current="page"] .step{border-color:#fff}
.logo{display:block;max-width:150px;max-height:48px;margin:0 0 8px;background:#fff;padding:6px 10px;border-radius:8px}
.nav .group{font-size:11px;opacity:.5;padding:10px 10px 4px;letter-spacing:.02em}
.side .foot{margin-top:auto;font-size:12px;opacity:.6;line-height:1.4;padding-top:12px}
.main{padding:18px 32px 60px;max-width:1280px;min-width:0}
.scen{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px;padding:10px 12px;background:var(--panel);border:1px solid var(--line-2);border-radius:14px;box-shadow:var(--shadow)}
.scen .lbl{font-size:13px;color:var(--ink-2);margin-right:4px}
.scen button{cursor:pointer;border:1px solid var(--line);background:var(--bg);padding:6px 11px;border-radius:999px;font-size:13px}
.scen button[aria-pressed="true"]{background:var(--brand);color:#fff;border-color:var(--brand)}
:root[data-theme="dark"] .scen button[aria-pressed="true"],:root:not([data-theme="light"]) .scen button[aria-pressed="true"]{color:#101214}
.scen .reset{margin-left:auto;border-style:dashed}
.scen .desc{flex-basis:100%;font-size:13px;color:var(--ink-2);margin:2px 0 0}
.strip{display:flex;gap:0;margin:0 0 16px;border:1px solid var(--line-2);border-radius:12px;overflow:hidden;background:var(--panel);box-shadow:var(--shadow)}
.strip div{flex:1;padding:8px 6px;font-size:12px;text-align:center;color:var(--ink-3);border-right:1px solid var(--line-2);position:relative}
.strip div:last-child{border-right:0}
.strip div.done{color:var(--ok);background:var(--ok-bg)}
.strip div.now{color:#fff;background:var(--brand);font-weight:600}
.strip div b{display:block;font-size:11px;font-weight:500;opacity:.8}
.topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px}
h1{font-size:26px;font-weight:700;letter-spacing:-.02em;margin:0}
h2{font-size:16px;font-weight:600;margin:0 0 10px}
.sub{color:var(--ink-2);margin:4px 0 0;font-size:14px}
.order-pick{display:flex;align-items:center;gap:8px;font-size:14px}
.order-pick select{padding:7px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.side .lang{margin:4px 0 12px;align-self:flex-start}.side .lang button{background:rgba(255,255,255,.08);color:#fff}.side .lang button[aria-pressed="true"]{background:var(--brand)}
.card{background:var(--panel);border:1px solid var(--line-2);border-radius:14px;padding:18px 20px;margin-bottom:16px;box-shadow:var(--shadow)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:980px){.grid2,.grid3{grid-template-columns:1fr}}
.form{display:grid;grid-template-columns:repeat(2,1fr);gap:12px 18px}
.form label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--ink-2)}
.form input,.form select,textarea{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.form input:focus,.form select:focus,select:focus,textarea:focus{outline:2px solid var(--sel-ink);outline-offset:1px}
.form .full{grid-column:1/-1}
.btn{cursor:pointer;border:1px solid var(--brand);background:linear-gradient(180deg,var(--brand-2),var(--brand));color:#fff;padding:9px 16px;border-radius:10px;font-weight:600;font-size:14px;box-shadow:0 6px 14px -8px var(--brand)}
.btn:hover{filter:brightness(1.15)}
.btn.secondary{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.sm{padding:4px 9px;font-size:13px;font-weight:500}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible{outline:2px solid var(--sel-ink);outline-offset:2px}
:root[data-theme="dark"] .btn,:root:not([data-theme="light"]) .btn{color:#fff}
:root[data-theme="dark"] .btn.secondary,:root:not([data-theme="light"]) .btn.secondary{color:var(--ink)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:500;color:var(--ink-2);font-size:12.5px;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:7px 8px;border-bottom:1px solid var(--line-2);vertical-align:top}
td.num,th.num{text-align:right}
tr:last-child td{border-bottom:0}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap}
.tag.ok{background:var(--ok-bg);color:var(--ok)}.tag.warn{background:var(--warn-bg);color:var(--warn)}.tag.bad{background:var(--bad-bg);color:var(--bad)}.tag.neutral{background:var(--line-2);color:var(--ink-2)}
.tag.sel{background:var(--brand-bg);color:var(--brand-ink)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
@media (max-width:980px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--panel);border:1px solid var(--line-2);border-left:4px solid var(--brand);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow)}
.kpi .v{font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.1;overflow-wrap:anywhere;color:var(--brand-ink)}
.kpi .l{font-size:13px;color:var(--ink-2);margin-top:4px}
.schema{width:100%;height:auto;display:block}
.hint{font-size:13px;color:var(--ink-2);background:var(--bg);border-left:3px solid var(--alu);padding:8px 12px;border-radius:0 8px 8px 0;margin:10px 0 0}
.see{font-size:13.5px;color:var(--brand-ink);background:var(--brand-bg);padding:10px 14px;border-radius:12px;margin:0 0 16px;border-left:4px solid var(--brand)}
.see b{font-weight:600}
.check{display:flex;align-items:center;gap:10px;padding:8px 6px;border-bottom:1px solid var(--line-2);cursor:pointer}
.check:last-child{border-bottom:0}
.check input{width:18px;height:18px;accent-color:var(--ok);flex:none}
.check .n{color:var(--ink-3);font-size:13px;margin-left:auto;white-space:nowrap}
.check.done span.t{text-decoration:line-through;color:var(--ink-3)}
.progress{height:6px;background:var(--line-2);border-radius:999px;overflow:hidden;margin:8px 0 12px}
.progress i{display:block;height:100%;background:var(--ok);width:0;transition:width .25s}
.zone-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
.lock{display:flex;gap:12px;align-items:center;padding:12px 16px;border-radius:10px;background:var(--warn-bg);color:var(--warn);font-weight:500}
.lock.open{background:var(--ok-bg);color:var(--ok)}
.lock.bad{background:var(--bad-bg);color:var(--bad)}
.doc{border:1px solid var(--line);border-radius:10px;padding:22px 26px;background:var(--panel);max-width:720px}
.doc .head{display:flex;justify-content:space-between;gap:16px;border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:14px}
.doc .head b{font-size:20px}
.doc.locked{opacity:.45;filter:grayscale(1);pointer-events:none}
.map-wrap{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--line);align-self:start}
.map-wrap img{display:block;width:100%;height:auto;max-width:100%}
.hot{position:absolute;border:2px solid transparent;border-radius:6px;cursor:pointer;background:transparent;padding:0}
.hot:hover,.hot:focus-visible{border-color:#173E66;background:rgba(23,62,102,.12);outline:none}
.hot[aria-pressed="true"]{border-color:#B4600A;background:rgba(180,96,10,.18)}
.map-grid{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px}
@media (max-width:980px){.map-grid{grid-template-columns:1fr}}
.row-flag td{background:var(--warn-bg)}
.cmp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:980px){.cmp{grid-template-columns:1fr}}
.cmp ul{margin:8px 0 0;padding-left:18px;font-size:14px}
.cmp li.missing{color:var(--bad)}
.muted{color:var(--ink-3)}
.small{font-size:13px}
.tabs{display:flex;gap:4px;margin-bottom:12px;border-bottom:1px solid var(--line)}
.tabs button{cursor:pointer;border:0;background:none;padding:8px 12px;font-size:14px;color:var(--ink-2);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink);font-weight:600}
.events{position:fixed;right:18px;top:calc(14px + env(safe-area-inset-top,0px));width:300px;z-index:5;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.ev{background:var(--ink);color:var(--bg);padding:9px 12px;border-radius:10px;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.18);opacity:0;transform:translateY(-6px);transition:opacity .25s,transform .25s}
.ev.show{opacity:1;transform:none}
.ev b{display:block;font-size:11px;opacity:.7;font-weight:500}
.evlog{font-size:13px}
.evlog div{padding:5px 0;border-bottom:1px solid var(--line-2);display:flex;gap:10px}
.evlog div:last-child{border:0}
.evlog time{color:var(--ink-3);flex:none;width:52px}
.truck{display:flex;flex-direction:column-reverse;gap:6px;border:2px solid var(--alu);border-radius:8px;padding:10px;background:var(--bg);min-height:160px}
.truck .pal{padding:10px 12px;border-radius:6px;background:var(--panel);border:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px}
.truck .pal.loaded{border-color:var(--ok);background:var(--ok-bg)}
.truck .door{text-align:center;font-size:12px;color:var(--ink-3);padding-top:4px}
.chart-box{position:relative;height:220px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:6}
.toast.show{opacity:1}
.scroll{overflow-x:auto}
@media (max-width:860px){.app{grid-template-columns:1fr}.side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;gap:2px 8px;padding:10px 12px}.side .foot,.demo-tag,.nav .group{display:none}.nav{flex-direction:row;flex-wrap:wrap}.nav button{padding:6px 8px;font-size:13px}.nav .step{display:none}.main{padding:12px 12px 50px}.form{grid-template-columns:1fr}.events{width:calc(100% - 24px);right:12px}.scen .reset{margin-left:0}}

/* Werkstatt / Tablet */
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{cursor:pointer;border:0;background:var(--panel);padding:6px 12px;font-size:13px;font-weight:600}
.lang button[aria-pressed="true"]{background:var(--brand);color:#fff}
:root[data-theme="dark"] .lang button[aria-pressed="true"],:root:not([data-theme="light"]) .lang button[aria-pressed="true"]{color:#101214}
.stations{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.stations button{cursor:pointer;border:1px solid var(--line);background:var(--panel);padding:10px 16px;border-radius:10px;font-size:15px;font-weight:500}
.stations button[aria-pressed="true"]{background:var(--brand);color:#fff;border-color:var(--brand)}
.tablet{max-width:860px;margin:0 auto;border:12px solid #1B2A38;border-radius:28px;background:var(--bg);box-shadow:0 20px 50px rgba(0,0,0,.25);overflow:hidden;display:flex;flex-direction:column;min-height:620px}
.tablet-in{padding:22px 24px;flex:1}
.tablet-foot{display:flex;gap:12px;padding:14px 24px calc(14px + env(safe-area-inset-bottom,0px));background:var(--panel);border-top:1px solid var(--line);flex-wrap:wrap;align-items:center}
.thead{font-size:17px;margin-bottom:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tprog{font-size:15px;color:var(--ink-2);margin-bottom:12px}
.tstep{font-size:14px;color:var(--ink-2);margin:12px 0 6px;font-weight:500}
.tcard{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px 20px}
.tsku{font-size:34px;font-weight:700;letter-spacing:-.02em;display:flex;align-items:center;gap:12px;line-height:1.1}
.tsub{font-size:16px;color:var(--ink-2);margin-top:6px}
.ral{display:inline-block;width:30px;height:30px;border-radius:7px;border:2px solid;vertical-align:middle;flex:none}
.trow{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.tcuts{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 10px}
.tcut{font-size:40px;font-weight:700;letter-spacing:-.02em;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:8px 18px;line-height:1}
.tcut small{font-size:14px;font-weight:500;color:var(--ink-3);margin-left:4px}
.tbig{font-size:19px;font-weight:600;padding:14px 16px;border-radius:12px;margin-top:8px}
.tbig.ok{background:var(--ok-bg);color:var(--ok)}.tbig.warn{background:var(--warn-bg);color:var(--warn)}.tbig.bad{background:var(--bad-bg);color:var(--bad)}
.tbtn{cursor:pointer;min-height:64px;padding:0 22px;border-radius:14px;font-size:19px;font-weight:600;border:2px solid var(--line);background:var(--panel);color:var(--ink)}
.tbtn.big{flex:1;min-width:150px;min-height:72px;font-size:22px}
.tbtn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.tbtn.warn{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
.tbtn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
:root[data-theme="dark"] .tbtn.primary,:root:not([data-theme="light"]) .tbtn.primary{color:#101214}
.tbtn.ghost{background:transparent}
.tbtn.sq{min-width:64px;padding:0 12px;font-size:17px}
.tbtn:disabled{opacity:.4;cursor:not-allowed}
.tbtn:focus-visible,.tile:focus-visible{outline:3px solid var(--sel-ink);outline-offset:2px}
.treasons{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}
.tzone{margin-top:6px}
.ttiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.ttiles.one{grid-template-columns:1fr}
.tile{cursor:pointer;text-align:left;min-height:64px;padding:12px 16px;border-radius:12px;font-size:17px;font-weight:500;border:2px solid var(--line);background:var(--panel);color:var(--ink);display:flex;flex-direction:column;justify-content:center;gap:2px}
.tile small{font-size:13px;color:var(--ink-3);font-weight:400}
.tile.on{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.tile.warn{border-color:var(--warn);color:var(--warn);background:var(--warn-bg)}
.tile.static{cursor:default}
.tile:disabled{opacity:.45;cursor:not-allowed}
.tile-row{display:flex;gap:10px;align-items:stretch}
.tile-row .tile{flex:1}
.qty{display:flex;align-items:center;gap:10px;font-size:26px;font-weight:700;min-width:170px;justify-content:center}
@media (max-width:860px){.tablet{border-width:0;border-radius:0;box-shadow:none;margin:0 -12px}.ttiles{grid-template-columns:1fr}.treasons{grid-template-columns:1fr}}

/* Autoplay */
.apbar{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(900px,calc(100% - 24px));background:var(--ink);color:var(--bg);border-radius:16px;padding:12px 16px;z-index:8;display:grid;grid-template-columns:1fr auto;gap:4px 16px;box-shadow:0 12px 40px rgba(0,0,0,.35);font-size:15px}
.apbar .ap-role{font-weight:700;font-size:13px;opacity:.8}
.apbar .ap-text{grid-row:2;line-height:1.4}
.apbar .ap-ctl{grid-row:1/3;display:flex;gap:6px;align-items:center}
.apbar .ap-step{font-size:12px;opacity:.7;margin-right:4px}
.apbar button{cursor:pointer;border:1px solid rgba(255,255,255,.35);background:transparent;color:inherit;border-radius:8px;padding:6px 10px;font-size:14px}
.ap-hl{outline:3px solid #B4600A!important;outline-offset:3px;border-radius:8px;transition:outline-color .2s}
.scen .play{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
@media (max-width:860px){.apbar{grid-template-columns:1fr}.apbar .ap-ctl{grid-row:3}}

/* Auftragsverfolgung */
.row-sel td{background:var(--brand-bg)}
.mini{height:4px;background:var(--line-2);border-radius:999px;margin-top:6px;width:120px;overflow:hidden}.mini i{display:block;height:100%;background:var(--brand)}
.timeline{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;margin-top:8px}
.timeline div{position:relative;padding:10px 8px 8px;border-top:3px solid var(--line);font-size:12.5px;color:var(--ink-3)}
.timeline div.done{border-top-color:var(--ok);color:var(--ink)}
.timeline div i{position:absolute;top:-8px;left:8px;width:12px;height:12px;border-radius:50%;background:var(--panel);border:3px solid var(--line)}

const RULES={ traegerOffset:106, klipOffset:86, gap:28, stdPanel:980, postMaxWidth:5000 };
const skuLen=l=>l>=2000?l/10:l;
function computeRecipe(o){
  const B=+o.B, T=+o.T, vsg=o.glas==="VSG";
  const pitch=vsg?757:1008;
  const n=Math.max(2,Math.ceil(B/pitch));
  let panels;
  if(vsg){ const w=Math.round((B-(n+1)*RULES.gap)/n); panels=Array(n).fill(w); }
  else{ const nStd=n-2, rest=B-(n+1)*RULES.gap-nStd*RULES.stdPanel; let edge=Math.round(rest/2);
    if(Math.abs(edge-980)<=15) edge=980; else for(const s of [942,840]) if(Math.abs(edge-s)<=8) edge=s;
    panels=[edge,...Array(nStd).fill(RULES.stdPanel),edge]; }
  const trL=T-RULES.traegerOffset, klL=T-RULES.klipOffset;
  const posts=(B<=RULES.postMaxWidth?2:3)+(o.extraPost||0);
  const group=arr=>{const m={};arr.forEach(w=>m[w]=(m[w]||0)+1);return Object.entries(m).map(([w,c])=>[+w,c]).sort((a,b)=>b[0]-a[0]);};
  const pw=group(panels);
  const prof=[{name:"Wandprofil",qty:1,len:B},{name:"Regenrinne",qty:1,len:B},{name:"Scharniere",qty:2,len:B},
    {name:"Träger",qty:n+1,len:trL},{name:"Klip",qty:n-1,len:klL},{name:"Endklip",qty:2,len:klL},
    {name:"Pfosten",qty:posts,len:+o.pfosten||2500},{name:"Pfosten Klip",qty:posts,len:+o.pfosten||2500}];
  pw.forEach(([w,c])=>{ const sp=(!vsg&&w===980)?943:w-30; prof.push({name:"Abstandhalter",qty:2*c,len:sp}); prof.push({name:vsg?"VSG L-Profil":"U 16",qty:c,len:w}); });
  const panelRows=pw.map(([w,c])=>({name:vsg?"VSG-Glas":"Stegplatte",qty:c,w,len:klL,extern:vsg}));
  const smalls=SMALLS.map(s=>({name:s.name,qty:typeof s.qty==="function"?s.qty({n,B,T}):s.qty,len:typeof s.len==="function"?s.len({B,T}):s.len,unit:s.unit,loc:s.loc,src:s.src,note:s.note}));
  return {n,panels,pw,prof,panelRows,smalls,posts,trL,klL,vsg};
}
function skuOf(name,o,stock){ const a=ARTICLES[name]; const code=a[o.modell]; return a.uncolored?`${code}-${skuLen(stock)}`:`${code}-${o.farbe}-${skuLen(stock)}`; }
function baseOf(name,o){ const a=ARTICLES[name]; const code=a[o.modell]; return a.uncolored?code:`${code}-${o.farbe}`; }
function restMin(name){ return ARTICLES[name].small?REST_MIN_SMALL:REST_MIN_DEFAULT; }

/* Zuschnittplanung: je Artikel+Farbe alle Teile; zuerst Reststücke (Z5-Rest), dann Stange mit geringstem Verschnitt.
   Jeder Schnitt kostet KERF mm. Ergebnis: Liste von "Stangen" mit zugeordneten Teilen. */
function packInto(L,pieces){ // first-fit-decreasing in eine Stange (pieces absteigend sortiert)
  let used=0, out=[];
  for(const p of pieces){ const add=p+(out.length?KERF:0); if(used+add<=L){ used+=add; out.push(p); } }
  return out;
}
function cutPlan(o,r,restStock){
  const bars=[]; const groups={};
  r.prof.forEach(p=>{ const k=p.name; if(!groups[k]) groups[k]=[]; for(let i=0;i<p.qty;i++) groups[k].push(p.len); });
  const restUsed=new Set();
  Object.entries(groups).forEach(([name,pieces])=>{
    const a=ARTICLES[name]; pieces.sort((x,y)=>y-x); let remaining=[...pieces]; const base=baseOf(name,o);
    // 1) Reststücke
    (restStock||[]).filter(rs=>rs.base===base&&!restUsed.has(rs.id)).sort((x,y)=>x.len-y.len).forEach(rs=>{
      if(!remaining.length) return;
      const packed=packInto(rs.len,remaining); if(!packed.length) return;
      const fits=packed.filter(p=>p<=rs.len); if(!fits.length) return;
      restUsed.add(rs.id); packed.forEach(p=>{ const i=remaining.indexOf(p); if(i>=0) remaining.splice(i,1); });
      const used=packed.reduce((s,p)=>s+p,0)+KERF*packed.length; const rest=rs.len-used;
      bars.push({name,art:a,sku:rs.id,restId:rs.id,fromRest:true,loc:rs.loc,stock:rs.len,pieces:packed,rest:Math.max(0,rest),min:restMin(name)});
    });
    // 2) Standardstangen – Länge mit geringstem Verschnitt
    while(remaining.length){
      let best=null;
      for(const L of a.lengths){ if(L<remaining[0]) continue; const packed=packInto(L,remaining); const used=packed.reduce((s,p)=>s+p,0)+KERF*packed.length; const waste=L-used; const score=waste/Math.max(1,packed.length); if(!best||score<best.score||(score===best.score&&L<best.L)) best={L,packed,waste,score}; }
      if(!best){ // Überlänge: größte Stange, 1 Teil
        const L=a.lengths[a.lengths.length-1]; const p=remaining.shift(); bars.push({name,art:a,sku:skuOf(name,o,L),loc:a.loc,stock:L,pieces:[p],rest:0,over:true,min:restMin(name)}); continue; }
      best.packed.forEach(p=>{ const i=remaining.indexOf(p); if(i>=0) remaining.splice(i,1); });
      const noCut=best.packed.length===1&&best.packed[0]===best.L;
      bars.push({name,art:a,sku:skuOf(name,o,best.L),loc:a.loc,stock:best.L,pieces:best.packed,rest:noCut?0:best.waste,noCut,min:restMin(name)});
    }
  });
  bars.forEach((b,i)=>{ b.idx=i; b.cls=b.noCut||b.over?"none":b.rest>=b.min?"rest":"schrott"; });
  return bars;
}
function naiveWaste(o,r){ // Vergleich: je Teil eine eigene Stange "nächste Länge"
  let w=0; r.prof.forEach(p=>{ const a=ARTICLES[p.name]; const L=a.lengths.find(l=>l>=p.len)||a.lengths[a.lengths.length-1]; w+=Math.max(0,L-p.len)*p.qty; }); return w;
}

const STATUS_DE=["Offen","Material reserviert","Im Zuschnitt","Kommissionierung","Versandbereit","Verladen","Versendet","Montiert"]; const STATUS_TR=["Açık","Malzeme rezerve","Kesimde","Toplamada","Sevke hazır","Yüklendi","Sevk edildi","Monte edildi"]; const STATUS=new Proxy(STATUS_DE,{get:(t,k)=>(S&&S.lang==="tr"?STATUS_TR:STATUS_DE)[k]});
function planFor(o,r){ if(!S.planCache) S.planCache={}; if(!S.planCache[o.id]) S.planCache[o.id]=stripPlan(cutPlan(o,r,S.rest)); return S.planCache[o.id]; }

function shortages(o,r){ const plan=planFor(o,r); const c=S.cut[o.id]||{}; const need={}; plan.filter((b,i)=>!b.fromRest&&!c[i]).forEach(b=>need[b.sku]=(need[b.sku]||0)+1); return Object.entries(need).filter(([sku,n])=>(S.stock[sku]||0)<n).map(([sku,n])=>({sku,need:n,have:S.stock[sku]||0})); }

function pickDone(o,r){ const L=pickLists(o,r), p=S.pick[o.id]||{}; const d=k=>L[k].every((_,i)=>p[k+i]); const z10=L.z10.length?d("z10"):true; return {z8:d("z8"),z9:d("z9"),z10,all:d("z8")&&d("z9")&&z10}; }
function packages(o,r){ const pk=[{k:"z8",t:"Profilbündel Z8"},{k:"z9",t:"Zubehör-Koli Z9"}]; if(r.vsg) pk.push({k:"z10",t:"Glas Z10"}); else pk.push({k:"z7",t:"Stegplatten Z7"}); return pk; }

function schemaSVG(o,r){ const W=640,H=150,pad=30,inner=W-2*pad,scale=inner/o.B; let x=pad,fields="",labels="";

    <p class="hint">Standardbreiten laut Konfigurator 3060–12060 mm, Tiefen 2500–5000 mm; VSG bis 4000 mm. Sondermaße werden akzeptiert und gekennzeichnet.</p></div>
   <div class="card"><h2>Dachschema (live)</h2>${schemaSVG(o,r)}<div class="kpis" style="margin-top:14px"><div class="kpi"><div class="v">${r.n}</div><div class="l">Felder</div></div><div class="kpi"><div class="v">${r.n+1}</div><div class="l">Träger</div></div><div class="kpi"><div class="v" style="font-size:18px">${r.pw.map(([w,c])=>`${c}×${w}`).join(" + ")}</div><div class="l">Plattenbreiten</div></div><div class="kpi"><div class="v">${r.prof.reduce((a,p)=>a+p.qty,0)+r.smalls.length+r.panelRows.reduce((a,p)=>a+p.qty,0)}</div><div class="l">Positionen</div></div></div></div></div>

  const restRows=S.rest.map(q=>`<tr><td><b>${q.id}</b><div class="small muted">${q.base}</div></td><td class="num">${fmt(q.len)} mm</td><td>${q.loc}</td><td class="small muted">aus ${q.from}</td></tr>`).join("")||'<tr><td colspan="4" class="muted">Keine Reststücke im Lager.</td></tr>';

  const lead=Math.max(0,...sh.map(s=>(SUPPLIERS[s.sku.slice(0,4)]||SUPPLIERS.default).lead)); const eta=new Date(); eta.setDate(eta.getDate()+lead+3);

  <div class="kpis"><div class="kpi"><div class="v">${d.lead[7]} Tage</div><div class="l">Durchlaufzeit Auftrag → Abfahrt (KW 40, von ${d.lead[0]})</div></div><div class="kpi"><div class="v">${d.reuse[7]} %</div><div class="l">Verschnitt wiederverwendet (Z5-Rest)</div></div><div class="kpi"><div class="v">${S.scrap.filter(x=>x.manual).length+rek}</div><div class="l">Ausschuss- und Reklamationsmeldungen (live)</div></div><div class="kpi"><div class="v">96 %</div><div class="l">Vollständige Lieferungen (Ziel 100 %)</div></div></div>

function drawCharts(){ if(typeof Chart==="undefined"||!document.getElementById("c1")) return; const d=kpiData(); const ink=getComputedStyle(document.documentElement).getPropertyValue("--ink-2").trim();
  Chart.defaults.color=ink; Chart.defaults.font.family='"Inter Tight",system-ui,sans-serif';
  new Chart(document.getElementById("c1"),{type:"bar",data:{labels:d.weeks,datasets:[{label:"Schrott",data:d.waste,backgroundColor:"#6C7780"},{label:"wiederverwendet",data:d.reuse.map((r,i)=>Math.round(d.waste[i]*r/100)),backgroundColor:"#1E7B4F"}]},options:{responsive:true,maintainAspectRatio:false,scales:{x:{stacked:true},y:{stacked:true}}}});
  new Chart(document.getElementById("c2"),{type:"bar",data:{labels:d.sizes,datasets:[{label:"kg Alu",data:d.alu,backgroundColor:"#173E66"}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}}}});
  new Chart(document.getElementById("c3"),{type:"bar",data:{labels:d.stations,datasets:[{label:"h",data:d.hours,backgroundColor:["#6C7780","#6C7780","#6C7780","#B4600A"]}]},options:{indexAxis:"y",responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}}}});
  new Chart(document.getElementById("c4"),{type:"line",data:{labels:d.weeks,datasets:[{label:"Durchlaufzeit Tage",data:d.lead,borderColor:"#173E66",tension:.3},{label:"Wiederverwendung %",data:d.reuse,borderColor:"#1E7B4F",tension:.3}]},options:{responsive:true,maintainAspectRatio:false}}); }

   <tr><td>Fehlendes Teil fällt erst bei der Montage beim Kunden auf</td><td>Versand gesperrt, bis Z8, Z9 und Z10 vollständig; Verladecheckliste vor Abfahrt</td></tr>

   <tr><td>Zubehör wird aus Erfahrung gepackt</td><td>Zubehör-Set je Produktgröße als Rezeptur (Z9-Koli)</td></tr>

   <tr><td>Keine Kennzahlen</td><td>Durchlaufzeit, Ausschuss, Verschnitt, Vollständigkeit – aus Zeitstempeln</td></tr>
  </tbody></table></div></div>
  <div class="card"><h2>Ereignisprotokoll dieser Sitzung</h2><div class="evlog">${S.events.map(e=>`<div><time>${e.t}</time><span><b>${esc(e.station)}</b> · ${esc(e.text)}</span></div>`).join("")||'<p class="muted">Noch keine Ereignisse.</p>'}</div></div>`; }

const tr=k=>(T[S.lang||"de"][k]??T.de[k]);
const STATIONS=["saege","komm","verl","mont","we"];
function tabHead(){ const st=S.station||"saege";
  return scenBar()+`<div class="topbar"><div><h1>${tr("werkstatt")}</h1><p class="sub">${tr("tabletHint")}</p></div><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><label class="order-pick">${tr("auftrag")} <select id="orderSel">${S.orders.map(o=>`<option value="${o.id}" ${o.id===S.sel?'selected':''}>${o.id} · ${o.B}×${o.T}</option>`).join("")}</select></label></div></div>
  <div class="stations">${STATIONS.map(s=>`<button data-station="${s}" aria-pressed="${st===s}">${tr(s)}</button>`).join("")}</div>`; }
function tabletFrame(inner,footer){ return `<div class="tablet"><div class="tablet-in">${inner}</div>${footer?`<div class="tablet-foot">${footer}</div>`:""}</div>`; }
function colorBox(f){ return `<span class="ral" style="background:${f==="7016"?"#383E42":"#F4F4F2"};border-color:${f==="7016"?"#383E42":"#999"}"></span>`; }

function tabSaege(){ const o=cur(), r=computeRecipe(o); const cs=cutState(o,r); const c=S.cut[o.id]||{}; const tb=S.tab||{};
  let idx=cs.plan.findIndex((_,i)=>!c[i]&&!(tb.skip||[]).includes(i)); if(idx<0) idx=cs.plan.findIndex((_,i)=>!c[i]);
  const prog=`<div class="tprog"><span>${tr("fortschritt")} ${cs.done}/${cs.total}</span><div class="progress" style="margin:6px 0 0"><i style="width:${cs.total?Math.round(cs.done/cs.total*100):0}%"></i></div></div>`;
  if(statusOf(o)>=3||idx<0) return tabletFrame(`${prog}<div class="tbig ok">✓ ${tr("allDone")}</div><div class="tsub">${tr("next")}: ${S.orders.find(x=>x.id!==o.id&&statusOf(x)<3)?.id||"–"}</div>`);
  if(statusOf(o)===0) return tabletFrame(`<div class="tbig warn">${tr("noWork")}</div><div class="tsub">${o.id} · ATP</div>`);
  const b=cs.plan[idx]; const scanned=tb.scanned===idx, wrong=tb.wrong===idx;
  const restLine=b.cls==="rest"?`<span class="tag ok" style="font-size:15px">${tr("rest")} ${fmt(b.rest)} mm → ${tr("restLager")}</span>`:b.cls==="schrott"?`<span class="tag neutral" style="font-size:15px">${tr("rest")} ${fmt(b.rest)} mm · ${tr("restSchrott")}</span>`:`<span class="tag neutral" style="font-size:15px">${tr("restNone")}</span>`;
  const card=`<div class="tcard"><div class="tstep">1 · ${tr("holen")}</div><div class="tsku">${colorBox(o.farbe)} ${b.sku}${b.fromRest?` <span class="tag sel">${tr("rest")}</span>`:""}</div><div class="tsub">${b.name}${b.artName?" · "+b.artName:""} · ${tr("regal")} <b>${b.loc}</b> · ${fmt(b.stock)} mm</div>
    ${!scanned?`<div class="trow"><button class="tbtn primary" data-tact="scan">${tr("scan")}</button><button class="tbtn ghost" data-tact="scanwrong">${tr("scanWrong")}</button></div>${wrong?`<div class="tbig bad">✕ ${tr("scanBad")}</div>`:""}`:`<div class="tbig ok">✓ ${tr("scanOk")}</div>
    <div class="tstep">2 · ${tr("schneiden")}</div><div class="tcuts">${b.pieces.map(p=>`<div class="tcut">${fmt(p)}<small>mm</small></div>`).join("")}</div><div style="margin:6px 0 2px">${restLine}</div>`}</div>`;
  const reasons=tb.problem===idx?`<div class="treasons">${tr("reasons").map((rs,i)=>`<button class="tbtn warn" data-tact="reason" data-i="${i}">${rs}</button>`).join("")}<button class="tbtn ghost" data-tact="cancel">${tr("cancel")}</button></div>`:"";
  const foot=`<button class="tbtn big ok" data-tact="done" ${scanned?"":"disabled"}>${tr("fertig")}</button><button class="tbtn big warn" data-tact="problem">${tr("problem")}</button><button class="tbtn big ghost" data-tact="skip">${tr("skip")}</button>${tb.last!==undefined?`<button class="tbtn ghost" data-tact="undo">↶ ${tr("undo")}</button>`:""}`;
  return tabletFrame(`${prog}<div class="thead">${tr("auftrag")} <b>${o.id}</b> · ${esc(o.kunde)} · ${fmt(o.B)}×${fmt(o.T)} ${colorBox(o.farbe)}</div>${card}${reasons}`,foot); }

function tabKomm(){ const o=cur(), r=computeRecipe(o); const cs=cutState(o,r); const L=pickLists(o,r); const p=S.pick[o.id]||{}; const D=pickDone(o,r);
  if(!cs.all) return tabletFrame(`<div class="tbig warn">⏳ ${tr("pickWait")}</div><div class="tsub">${o.id} · ${cs.done}/${cs.total}</div>`);
  const zone=(k,title,items)=>items.length?`<div class="tzone"><div class="tstep">${title} <span class="muted">${items.filter((_,i)=>p[k+i]).length}/${items.length}</span></div><div class="ttiles">${items.map((t,i)=>`<button class="tile ${p[k+i]?'on':''}" data-pick-t="${k}${i}" ${k==="z10"&&!S.glasArrived?"disabled":""}>${p[k+i]?"✓ ":""}${t}</button>`).join("")}</div>${items.every((_,i)=>p[k+i])?`<div class="tbig ok" style="margin-top:8px">✓ ${tr("packDone")}</div>`:k==="z10"&&!S.glasArrived?`<div class="tbig warn" style="margin-top:8px">${tr("glasWait")}</div>`:""}</div>`:"";
  return tabletFrame(`<div class="thead">${tr("auftrag")} <b>${o.id}</b> · ${esc(o.kunde)} · <span class="muted">${tr("tapItem")}</span></div>${zone("z8","Z8",L.z8)}${zone("z9","Z9",L.z9)}${zone("z10","Z10",L.z10)}${D.all?`<div class="tbig ok">✓ ${tr("pickDone")}</div>`:""}`); }

function tabVerl(){ const ready=S.orders.filter(o=>statusOf(o)>=4); const stops=ready.map(o=>({o,r:computeRecipe(o),c:CUSTOMERS[o.cust]})).sort((a,b)=>b.c.km-a.c.km);
  if(!stops.length) return tabletFrame(`<div class="tbig warn">${tr("nothing")}</div>`);
  const missing=[]; stops.forEach(s=>packages(s.o,s.r).forEach(pk=>{ if(!(S.loaded[s.o.id]||{})[pk.k]) missing.push(`${s.o.id} ${pk.t}`); }));
  const tiles=stops.map((s,i)=>`<div class="tzone"><div class="tstep">${i+1} · ${s.c.city} <span class="muted">${i===0?tr("loadFirst"):i===stops.length-1?tr("loadLast"):""}</span></div><div class="ttiles">${packages(s.o,s.r).map(pk=>{ const ld=(S.loaded[s.o.id]||{})[pk.k]; return `<button class="tile ${ld?'on':''}" data-load-t="${s.o.id}|${pk.k}" ${S.departed?"disabled":""}>${ld?"✓ "+tr("loaded"):tr("missing")} · ${pk.t}<small>${s.o.id}</small></button>`; }).join("")}</div></div>`).join("");
  const gate=S.departed?`<div class="tbig ok">✓ ${tr("departed")} ${S.departed}</div>`:missing.length?`<div class="tbig bad">🔒 ${tr("gateLocked")} · ${missing.length} ${tr("missing")}</div>`:`<div class="tbig ok">✓ ${tr("gateOpen")}</div>`;
  return tabletFrame(`<div class="thead">${tr("loadOrder")}</div>${tiles}${gate}`,`<button class="tbtn big ok" data-tact="depart" ${missing.length||S.departed?"disabled":""}>${tr("depart")}</button>`); }

function tabMont(){ const o=cur(), r=computeRecipe(o); const m=S.montage[o.id]||{checks:{},fotos:{}}; const shipped=S.shipped[o.id]; const tb=S.tab||{};
  if(!shipped) return tabletFrame(`<div class="tbig warn">${tr("notShipped")}</div><div class="tsub">${o.id}</div>`);
  const steps=tr("steps"); const done=steps.filter((_,i)=>m.checks[i]).length;
  const tiles=`<div class="ttiles one">${steps.map((t,i)=>`<div class="tile-row"><button class="tile ${m.checks[i]?'on':''}" data-mont-t="${i}" ${m.abnahme?"disabled":""}>${m.checks[i]?"✓ ":""}${i+1}. ${t}</button><button class="tbtn ghost sq" data-foto="${i}">${(m.fotos||{})[i]?tr("fotoOk"):"📷 "+tr("foto")}</button></div>`).join("")}</div>`;
  const parts=[...new Set(r.prof.map(p=>p.name))].slice(0,8);
  const fehlt=tb.fehlt?`<div class="tzone"><div class="tstep">${tr("which")}</div><div class="ttiles">${parts.map(n=>`<button class="tile warn" data-fehlt="${n}">${n}</button>`).join("")}<button class="tile" data-tact="cancel">${tr("cancel")}</button></div></div>`:"";
  const rek=S.reklam.filter(x=>x.order===o.id); const sent=rek.length?`<div class="tbig warn">${tr("sent")}: ${rek.map(x=>x.part).join(", ")}</div>`:"";
  const sign=`<button class="tile ${m.signed?'on':''}" data-tact="sign" style="min-height:90px;border-style:dashed" ${m.abnahme?"disabled":""}>${m.signed?"✓ "+tr("signed"):"✍ "+tr("sign")}</button>`;
  return tabletFrame(`<div class="thead">${tr("auftrag")} <b>${o.id}</b> · ${esc(o.kunde)} · ${CUSTOMERS[o.cust].city} <span class="muted">${done}/${steps.length}</span></div>${tiles}${fehlt}${sent}<div style="margin-top:10px">${sign}</div>${m.abnahme?`<div class="tbig ok">✓ ${tr("abgenommen")} ${m.abnahme}</div>`:""}`,
   `<button class="tbtn big ok" data-tact="abnahme" ${done<steps.length||!m.signed||m.abnahme?"disabled":""}>${tr("abnahme")}</button><button class="tbtn big warn" data-tact="fehlt">${tr("teilFehlt")}</button>`); }

function tabWE(){ const open=S.inbound.filter(b=>b.status!=="gebucht"); if(!open.length) return tabletFrame(`<div class="tbig warn">${tr("noPo")}</div><div class="tsub">${S.inbound.filter(b=>b.status==="gebucht").map(b=>b.id+" ✓").join(" · ")}</div>`);
  const po=open[0]; const q=S.tab?.we||{};
  const lines=po.lines.map((l,i)=>{ const v=q[i]??l.qty; return `<div class="tile-row"><div class="tile static"><b>${l.sku}</b><small>${tr("regal")} ${l.loc} · ${tr("menge")} ${l.qty}</small></div><div class="qty"><button class="tbtn ghost sq" data-we="${i}" data-d="-1">−</button><span>${v}</span><button class="tbtn ghost sq" data-we="${i}" data-d="1">+</button></div></div>`; }).join("");

    if(lvl>=2){ st.cut[o.id]={}; const n=lvl===2?Math.ceil(plan.length/2):plan.length; for(let i=0;i<n;i++){ st.cut[o.id][i]={w:WORKERS[i%2].id,t:"0"+(7+(i%3))+":"+String(10+i*2).padStart(2,"0")}; if(!historic&&!plan[i].fromRest) st.stock[plan[i].sku]=Math.max(0,(st.stock[plan[i].sku]||0)-1); } }
    if(lvl>=3){ const L=pickLists(o,r); st.pick[o.id]={}; L.z8.forEach((_,i)=>st.pick[o.id]["z8"+i]=true); if(lvl>=4){ L.z9.forEach((_,i)=>st.pick[o.id]["z9"+i]=true); L.z10.forEach((_,i)=>st.pick[o.id]["z10"+i]=true); } }
    if(lvl>=6){ st.loaded[o.id]={z8:true,z9:true,z7:true,z10:true}; st.shipped[o.id]=dStr(dAgo(Math.max(0,o.daysAgo-6))); }
    if(lvl>=7){ st.montage[o.id]={checks:{0:1,1:1,2:1,3:1,4:1,5:1,6:1},fotos:{},signed:true,abnahme:dStr(dAgo(Math.max(0,o.daysAgo-8)))}; }
  });
  st.glasArrived=true;
  st.events=[
   {t:"09:12",station:"Einkauf",text:"B-26-07 Wochenbestellung ausgelöst – Eingang erwartet "+dStr(dIn(5)),id:1,d:dStr(dAgo(2))},
   {t:"08:40",station:"Zuschnitt M4",text:"A-26-206: Arbeitsauftrag auf dem Tablet, 42 Stangen",id:2,d:dStr(dAgo(1))},
   {t:"14:05",station:"Vertrieb",text:"A-26-210 angelegt – ATP: Wandprofil 7 m fehlt, Bestätigung ausstehend",id:3,d:dStr(new Date())},
   {t:"14:06",station:"System",text:"A-26-210: Nachschub B-26-07 deckt Bedarf → bestätigbar ab "+dStr(dIn(7)),id:4,d:dStr(new Date())},
  ]; st.evSeq=4; st.view="auftragsbuch"; st.sel="A-26-210";
}
// ATP-Zusatz: deckt eine offene Bestellung die Fehlmenge? → frühester Bestätigungstermin
function coverage(o,r){ const sh=shortages(o,r); if(!sh.length) return null; const open=S.inbound.filter(b=>b.status!=="gebucht");
  const covered=sh.every(s=>open.some(b=>b.lines.some(l=>l.sku===s.sku&&l.qty>=s.need-s.have)));
  if(!covered) return {sh,covered:false};
  const po=open.find(b=>b.lines.some(l=>sh.some(s=>s.sku===l.sku))); const [d,m,y]=po.eta.split("."); const eta=new Date(+y,+m-1,+d); const ok=new Date(eta); ok.setDate(ok.getDate()+2);
  return {sh,covered:true,po,eta:po.eta,confirmFrom:dStr(ok)}; }
function milestones(o){ const st=statusOf(o); const base=dAgo(o.daysAgo||0); const at=k=>{ const d=new Date(base); d.setDate(d.getDate()+k); return dStr(d); };
  const plan=[["Eingang",0,0],["Bestätigt",1,0],["Zuschnitt",2,2],["Kommissioniert",4,4],["Versendet",6,6],["Montiert",7,8]];
  return plan.map(([n,lvl,off])=>({n,reached:st>=lvl,date:st>=lvl?(lvl===6&&S.shipped[o.id]?S.shipped[o.id]:lvl===7&&S.montage[o.id]?.abnahme?S.montage[o.id].abnahme:at(off)):(st===0?"–":"geplant "+at(off+ (st>=2?0:0)))})); }
function viewAuftragsbuch(){ const sel=cur();
  const rows=S.orders.slice().sort((a,b)=>(a.daysAgo??0)-(b.daysAgo??0)).map(o=>{ const st=statusOf(o); const r=computeRecipe(o); const cov=st===0?coverage(o,r):null; const next=st===0?(cov&&cov.covered?`Material ${cov.eta}`:"Material bestellen"):st===1?"Zuschnitt M4":st===2?`Zuschnitt ${cutState(o,r).done}/${cutState(o,r).total}`:st===3?"Kommissionierung":st===4?"Versandtag":st===5?"Abfahrt":st===6?"Montage":"abgeschlossen";
    const term=st>=6?(S.shipped[o.id]||"")+(st===7?" · ✓":""):st===0?(cov&&cov.covered?`ab ${cov.confirmFrom}`:"offen"):dStr(dIn(Math.max(1,12-(o.daysAgo||0))));
    return `<tr class="${o.id===sel.id?'row-sel':''} ${st===0?'row-flag':''}" data-track="${o.id}" style="cursor:pointer"><td><b>${o.id}</b><div class="small muted">${o.created||""}</div></td><td>${esc(o.kunde)}<div class="small muted">${CUSTOMERS[o.cust].city}</div></td><td class="small">${o.modell==="classic"?"Classic":"Excellent"} ${fmt(o.B)}×${fmt(o.T)}<div class="muted">${esc(o.glas)}</div></td><td><span class="tag ${st===0?'bad':st>=6?'ok':'sel'}">${STATUS[st]}</span><div class="mini"><i style="width:${Math.round(st/7*100)}%"></i></div></td><td class="small">${next}</td><td class="small">${term}</td></tr>`; }).join("");
  const r=computeRecipe(sel), st=statusOf(sel), cov=st===0?coverage(sel,r):null, ms=milestones(sel);
  const detail=`<div class="card"><div class="zone-head"><h2>${sel.id} · ${esc(sel.kunde)}</h2><span class="tag ${st===0?'bad':st>=6?'ok':'sel'}">${STATUS[st]}</span></div>
   <div class="timeline">${ms.map(m=>`<div class="${m.reached?'done':''}"><i></i><b>${m.n}</b><span>${m.date}</span></div>`).join("")}</div>
   ${st===0&&cov?(cov.covered?`<div class="lock" style="margin-top:12px;flex-wrap:wrap">Fehlt: ${cov.sh.map(s=>`${s.sku} (${s.need-s.have} Stange)`).join(", ")}. Nachschub <b>${cov.po.id}</b> trifft am <b>${cov.eta}</b> ein → Auftrag bestätigbar ab <b>${cov.confirmFrom}</b>.${sel.informed?` <span class="tag ok">Kunde informiert ${sel.informed}</span>`:`<button class="btn sm" id="btnInform" style="margin-left:auto">Kunde über Termin informieren</button>`}</div>`:`<div class="lock bad" style="margin-top:12px">Fehlt: ${cov.sh.map(s=>s.sku).join(", ")} – keine offene Bestellung deckt den Bedarf. <button class="btn sm" id="btnOrderTrack" style="margin-left:auto">Bestellvorschlag</button></div>`):""}
   <div class="grid2" style="margin-top:14px"><div><h2 class="small" style="margin-bottom:6px">${L("Kundenansicht (Portal / E-Mail)","Müşteri görünümü (portal / e-posta)")}</h2><div class="portal"><b>${L("Ihr Auftrag","Siparişiniz")} ${sel.id}</b><br>${st===0?(cov&&cov.covered?`${L("Wir prüfen die Materialverfügbarkeit. Bestätigung und Liefertermin erhalten Sie bis zum","Malzeme uygunluğunu kontrol ediyoruz. Onay ve teslim tarihini şu tarihe kadar alacaksınız:")} <b>${cov.confirmFrom}</b>.`:L("Wir prüfen die Materialverfügbarkeit und melden uns.","Malzeme uygunluğunu kontrol edip döneceğiz.")):st<4?`${L("Ihr Terrassendach ist in Produktion. Voraussichtlicher Versand:","Teras çatınız üretimde. Tahmini sevk:")} <b>${dStr(dIn(Math.max(1,10-(sel.daysAgo||0))))}</b>`:st<6?L("Ihr Auftrag ist versandbereit. Der Fahrer meldet sich zur Terminabsprache.","Siparişiniz sevke hazır. Şoför teslim saati için sizi arayacak."):st===6?`${L("Ihr Auftrag wurde am","Siparişiniz")} ${S.shipped[sel.id]} ${L("ausgeliefert.","tarihinde teslim edildi.")}`:L("Montage abgeschlossen und abgenommen. Vielen Dank!","Montaj tamamlandı ve teslim alındı. Teşekkürler!")}</div></div>
   <div><h2 class="small" style="margin-bottom:6px">${L("Ereignisse","Olaylar")}</h2><div class="evlog">${S.events.filter(e=>e.text.includes(sel.id)).map(e=>`<div><time>${e.d?e.d.slice(0,5)+" ":""}${e.t}</time><span><b>${esc(e.station)}</b> · ${esc(e.text)}</span></div>`).join("")||'<p class="muted small">Keine Ereignisse zu diesem Auftrag.</p>'}</div></div></div></div>`;
  const counts=[0,0,0,0,0,0,0,0]; S.orders.forEach(o=>counts[statusOf(o)]++);
  const expected=S.inbound.filter(b=>b.status!=="gebucht");
  return topbar(L("Auftragsverfolgung","Sipariş takibi"),L("Alle Aufträge mit Status, nächstem Schritt und Liefertermin – für Büro und Kunde dieselbe Wahrheit.","Tüm siparişler durum, sonraki adım ve terminle – ofis ve müşteri için aynı gerçek."),false)+see(L("Zehn Aufträge aus drei Wochen. Der vierte neue Auftrag (A-26-210) bleibt offen, weil eine einzige 7-m-Wandprofilstange fehlt. Das System kennt die laufende Bestellung, nennt den Termin und informiert den Kunden – statt den Auftrag blind anzunehmen.","Üç haftadan on sipariş. Dördüncü yeni sipariş (A-26-210) tek bir 7 m duvar profili çubuğu eksik olduğu için açık kalıyor. Sistem bekleyen tedarik siparişini biliyor, termini söylüyor ve müşteriyi bilgilendiriyor – siparişi körlemesine kabul etmek yerine."))+`
  <div class="kpis"><div class="kpi"><div class="v">${S.orders.length}</div><div class="l">${L("Aufträge gesamt","Toplam sipariş")}</div></div><div class="kpi"><div class="v" style="color:${counts[0]?'var(--bad)':'var(--ok)'}">${counts[0]}</div><div class="l">${L("Bestätigung ausstehend (Material)","Onay bekliyor (malzeme)")}</div></div><div class="kpi"><div class="v">${counts[1]+counts[2]+counts[3]}</div><div class="l">${L("In Produktion","Üretimde")}</div></div><div class="kpi"><div class="v">${counts[4]+counts[5]}</div><div class="l">${L("Versandbereit","Sevke hazır")}</div></div></div>
  ${expected.length?`<div class="lock" style="margin-bottom:16px">📦 ${L("Wareneingang erwartet","Beklenen mal kabul")}: ${expected.map(b=>`<b>${b.id}</b> ${b.eta} (${b.lines.map(l=>l.qty+"× "+l.sku).join(", ")})`).join(" · ")} <span class="small muted" style="margin-left:auto">${L("Tor 1 · Buchung am Tablet","Kapı 1 · tablet ile kayıt")}</span></div>`:""}
  <div class="card"><div class="scroll"><table><thead><tr><th>${L("Auftrag","Sipariş")}</th><th>${L("Kunde","Müşteri")}</th><th>${L("Produkt","Ürün")}</th><th>Status</th><th>${L("Nächster Schritt","Sonraki adım")}</th><th>${L("Liefertermin","Termin")}</th></tr></thead><tbody>${rows}</tbody></table></div></div>${detail}`; }
document.addEventListener("click",e=>{ const b=e.target.closest("button"); const row=e.target.closest("tr[data-track]");
  if(row&&!b){ S.sel=row.dataset.track; render(); return; }
  if(b&&b.id==="btnInform"){ const o=cur(); const cov=coverage(o,computeRecipe(o)); o.informed=dStr(new Date()); pushEvent("Vertrieb",`${o.id}: Kunde informiert – Bestätigung und Liefertermin ab ${cov.confirmFrom}`); render(); return; }
  if(b&&b.id==="btnOrderTrack"){ document.getElementById("btnOrder")?.click(); const o=cur(); const sh=shortages(o,computeRecipe(o)); if(!sh.length) return; const eta=dIn(10); S.inbound.push({id:"B-26-"+String(S.inbound.length+8).padStart(2,"0"),supplier:SUPPLIERS.default.name,eta:dStr(eta),status:"bestellt",lines:sh.map(s=>({sku:s.sku,qty:s.need-s.have+2,loc:"Z6"}))}); pushEvent("Einkauf",`Bestellvorschlag für ${o.id} ausgelöst, Eingang ${dStr(eta)}`); render(); return; }
});

/* ===================== RENDER & AKTIONEN ===================== */
function render(){ renderNav(); document.querySelectorAll("#sideLang button").forEach(b=>b.setAttribute("aria-pressed",String((S.lang||"de")===b.dataset.lang))); const m=document.getElementById("main");
  const map={auftrag:viewAuftrag,rezeptur:viewRezeptur,bestand:viewBestand,wareneingang:viewWareneingang,zuschnitt:viewZuschnitt,kommission:viewKommission,versand:viewVersand,versandtag:viewVersandtag,montage:viewMontage,lager:viewLager,kpi:viewKPI,vergleich:viewVergleich,werkstatt:viewWerkstatt,auftragsbuch:viewAuftragsbuch};
  m.innerHTML=(map[S.view]||viewAuftrag)(); if(S.view==="kpi") drawCharts(); save(); }
function go(v){ S.view=v; render(); window.scrollTo({top:0}); }
function readForm(){ const o=cur(); const g=id=>document.getElementById(id);
  if(!g("f_B")) return o;
  const before=JSON.stringify([o.B,o.T,o.glas,o.modell,o.farbe,o.pfosten]);
  o.kunde=g("f_kunde").value||o.kunde; o.modell=g("f_modell").value; o.B=Math.max(2000,+g("f_B").value||o.B); o.T=Math.max(2000,+g("f_T").value||o.T);
  o.glas=g("f_glas").value; o.farbe=g("f_farbe").value; o.pfosten=+g("f_pf").value; o.mass=g("f_mass").value; o.notiz=g("f_notiz").value;
  if(o.glas==="VSG"&&o.T>4000){ o.T=4000; toast("VSG: Tiefe auf 4000 mm begrenzt"); }
  if(before!==JSON.stringify([o.B,o.T,o.glas,o.modell,o.farbe,o.pfosten])){ delete S.planCache[o.id]; S.cut[o.id]={}; S.pick[o.id]={}; }
  return o; }
function workerFor(i){ return WORKERS[i%2]; }
function markCut(o,i,on){ const r=computeRecipe(o); const plan=planFor(o,r); const b=plan[i]; S.cut[o.id]=S.cut[o.id]||{};
  if(on&&!S.cut[o.id][i]){ S.cut[o.id][i]={w:workerFor(i).id,t:now()};
    if(b.fromRest){ S.rest=S.rest.filter(x=>x.id!==b.restId); } else { S.stock[b.sku]=Math.max(0,(S.stock[b.sku]||0)-1); }
    if(b.cls==="rest"){ S.restSeq++; const id="R-00"+S.restSeq; S.rest.push({id,base:baseOf(b.name,o),len:b.rest,loc:"Z5-Rest",from:o.id}); toast(`Rest ${fmt(b.rest)} mm → Z5-Rest als ${id}`); }
    else if(b.cls==="schrott"){ S.scrap.push({base:baseOf(b.name,o),len:b.rest,from:o.id,t:now(),manual:false}); toast(`${b.sku} abgebucht · ${fmt(b.rest)} mm Schrott`); }
    else toast(`${b.sku} abgebucht`);
    const cs=cutState(o,r); if(cs.all){ pushEvent("Kommissionierung Z8/Z9/Z10",`${o.id} freigegeben – Liste liegt auf dem Tablet`); }
  } else if(!on&&S.cut[o.id][i]){ delete S.cut[o.id][i]; if(!b.fromRest) S.stock[b.sku]=(S.stock[b.sku]||0)+1; if(b.cls==="rest"){ S.rest=S.rest.filter(x=>!(x.from===o.id&&x.len===b.rest&&x.base===baseOf(b.name,o))); } } }

document.addEventListener("click",e=>{
  const t=e.target; const b=t.closest("button"); const id=b?b.id:"";
  if(b&&b.dataset.view){ go(b.dataset.view); return; }
  if(b&&b.dataset.scen){ if(AP.running) return; S=freshState(+b.dataset.scen); render(); toast("Szenario geladen"); return; }
  if(id==="btnReset"){ S=freshState(S.scen); render(); toast("Demo zurückgesetzt"); return; }
  if(b&&b.dataset.zone){ S.mapZone=S.mapZone===b.dataset.zone?null:b.dataset.zone; render(); return; }
  if(b&&b.dataset.tab){ S.stockTab=b.dataset.tab; render(); return; }
  if(id==="btnCalc"){ const o=readForm(); pushEvent("Lager",`${o.id}: Material reserviert, Rezeptur freigegeben`); go("rezeptur"); return; }
  if(id==="btnNew"){ const o=readForm(); const n=Object.assign({},o,{id:"A-26-"+(110+S.orders.length),created:new Date().toLocaleDateString("de-DE")}); S.orders.push(n); S.sel=n.id; go("rezeptur"); toast("Auftrag "+n.id+" angelegt"); return; }
  if(id==="btnOrder"){ const o=cur(); const sh=shortages(o,computeRecipe(o)); if(!sh.length) return; const lead=Math.max(...sh.map(s=>(SUPPLIERS[s.sku.slice(0,4)]||SUPPLIERS.default).lead)); const eta=new Date(); eta.setDate(eta.getDate()+lead);
    S.inbound.push({id:"B-26-"+String(S.inbound.length+1).padStart(2,"0"),supplier:SUPPLIERS.default.name,eta:eta.toLocaleDateString("de-DE"),status:"bestellt",lines:sh.map(s=>({sku:s.sku,qty:s.need-s.have+2,loc:ARTICLES[Object.keys(ARTICLES).find(k=>ARTICLES[k].classic===s.sku.slice(0,4)||ARTICLES[k].excellent===s.sku.slice(0,4))]?.loc||"Z6"}))});
    pushEvent("Einkauf",`Bestellvorschlag für ${o.id}: ${sh.length} Artikel, Liefertermin ${eta.toLocaleDateString("de-DE")}`); go("wareneingang"); return; }
  if(b&&b.dataset.book){ const po=S.inbound.find(x=>x.id===b.dataset.book); if(!po) return; po.lines.forEach(l=>S.stock[l.sku]=(S.stock[l.sku]||0)+l.qty); po.status="gebucht"; pushEvent("Lager Z6",`${po.id} gebucht: ${po.lines.reduce((a,l)=>a+l.qty,0)} Stangen etikettiert und eingelagert`); const o=cur(); if(!shortages(o,computeRecipe(o)).length) pushEvent("Vertrieb",`${o.id} ist jetzt lieferbar – Auftrag kann bestätigt werden`); render(); return; }
  if(id==="btnAllCut"){ const o=cur(); const plan=planFor(o,computeRecipe(o)); plan.forEach((_,i)=>markCut(o,i,true)); render(); return; }
  if(b&&b.dataset.scrap!==undefined){ const o=cur(); const plan=planFor(o,computeRecipe(o)); const p=plan[+b.dataset.scrap]; const reason=prompt("Ausschussgrund für "+p.name+":","Fehlschnitt"); if(reason===null) return;
    S.scrap.push({base:baseOf(p.name,o),len:p.pieces[0],from:o.id,t:now(),manual:true,name:p.name,reason:reason||"ohne Angabe",worker:workerFor(+b.dataset.scrap).name}); S.stock[p.sku]=Math.max(0,(S.stock[p.sku]||0)-1);
    pushEvent("Zuschnitt M4",`${o.id}: Ausschuss ${p.name} (${reason||"ohne Angabe"}) – Nachschnitt eingeplant`); render(); return; }
  if(id==="btnAllPick"){ const o=cur(); const L=pickLists(o,computeRecipe(o)); S.pick[o.id]={}; ["z8","z9"].forEach(k=>L[k].forEach((_,i)=>S.pick[o.id][k+i]=true)); if(S.glasArrived) L.z10.forEach((_,i)=>S.pick[o.id]["z10"+i]=true); if(pickDone(o,computeRecipe(o)).all) pushEvent("Versand",`${o.id} versandbereit – Lieferschein freigegeben`); render(); return; }
  if(id==="btnGlas"){ S.glasArrived=true; pushEvent("Z10 Glas",`Glaslieferung eingetroffen und geprüft – ${cur().id} kann abgeschlossen werden`); render(); return; }
  if(id==="btnLoadDemo"){ const ready=S.orders.filter(o=>statusOf(o)>=4); let first=true; ready.forEach(o=>{ const r=computeRecipe(o); S.loaded[o.id]={}; packages(o,r).forEach((p,i)=>{ if(first&&p.k==="z9"){ first=false; return; } S.loaded[o.id][p.k]=true; }); }); S.loadAttempt=true; render(); return; }
  if(id==="btnDepart"){ const ready=S.orders.filter(o=>statusOf(o)>=4); const missing=[]; ready.forEach(o=>{ const r=computeRecipe(o); packages(o,r).forEach(p=>{ if(!(S.loaded[o.id]||{})[p.k]) missing.push(`${o.id}: ${p.t}`); }); });
    if(missing.length){ pushEvent("Versand Tor 2",`Abfahrt gesperrt – ${missing.length} Position(en) nicht verladen`); render(); return; }
    S.departed=now(); ready.forEach(o=>{ S.shipped[o.id]=new Date().toLocaleDateString("de-DE"); }); pushEvent("Versand Tor 2",`Abfahrt ${S.departed}: ${ready.length} Aufträge versendet, Kunden benachrichtigt`); pushEvent("Montage",`${ready.map(o=>o.id).join(", ")} – Montagecheckliste auf dem Tablet des Montageteams`); render(); return; }
  if(id==="btnAbnahme"){ const o=cur(); S.montage[o.id]=S.montage[o.id]||{checks:{}}; S.montage[o.id].abnahme=new Date().toLocaleDateString("de-DE"); pushEvent("Buchhaltung",`${o.id} abgenommen – Rechnung kann gestellt werden`); render(); return; }
  if(id==="btnReklam"){ const o=cur(); const part=document.getElementById("rk_part").value, reason=document.getElementById("rk_reason").value, text=document.getElementById("rk_text").value;
    const plan=planFor(o,computeRecipe(o)); const c=S.cut[o.id]||{}; let trace="Zubehör-Koli Z9 · gepackt von Lukas Weber"; plan.forEach((b,i)=>{ if(b.name===part&&c[i]&&trace.startsWith("Zubehör")){ const w=WORKERS.find(x=>x.id===c[i].w); trace=`Stange ${b.sku} · ${w.name} · ${c[i].t}`; } });
    S.reklam.push({order:o.id,part,reason,text,trace,t:now()}); pushEvent("Zuschnitt M4",`Nachlieferung ${o.id}: ${part} (${reason}) – Nachschnitt eingeplant`); render(); return; }
});
document.addEventListener("change",e=>{ const t=e.target;
  if(t.id==="orderSel"){ S.sel=t.value; S.mapZone=null; render(); return; }
  if(t.dataset.cut!==undefined){ markCut(cur(),+t.dataset.cut,t.checked); render(); return; }
  if(t.dataset.pick!==undefined){ const o=cur(); S.pick[o.id]=S.pick[o.id]||{}; const was=pickDone(o,computeRecipe(o)).all; S.pick[o.id][t.dataset.pick]=t.checked; if(!was&&pickDone(o,computeRecipe(o)).all) pushEvent("Versand",`${o.id} versandbereit – Lieferschein freigegeben`); render(); return; }
  if(t.dataset.load){ const [oid,k]=t.dataset.load.split("|"); S.loaded[oid]=S.loaded[oid]||{}; S.loaded[oid][k]=t.checked; render(); return; }
  if(t.dataset.mont!==undefined){ const o=cur(); S.montage[o.id]=S.montage[o.id]||{checks:{}}; S.montage[o.id].checks[t.dataset.mont]=t.checked; render(); return; }
  if(["f_B","f_T","f_glas","f_modell","f_farbe","f_pf"].includes(t.id)){ readForm(); render(); }
});
S=load(); render();
